name: Prepare current unmatched list

on:
  push:
    branches:
      - agent/repair-skill-pack-import
    paths:
      - '.github/workflows/repair-current-unmatched.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-skill-pack-import
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          awk -F '\t' 'NR > 1 && $2 == "UNMATCHED" {print $1}' .repair/file-source-audit.tsv > /tmp/current-unmatched.txt
          gzip -9c /tmp/current-unmatched.txt | base64 -w0 > .repair/current-unmatched.txt.gz.b64
          sha256sum /tmp/current-unmatched.txt > .repair/current-unmatched.sha256
          printf 'count=%s\nbytes=%s\n' "$(wc -l < /tmp/current-unmatched.txt)" "$(awk -F '\t' 'NR > 1 && $2 == "UNMATCHED" {s += $4} END {print s+0}' .repair/file-source-audit.tsv)" > .repair/current-unmatched-summary.txt
          rm -f .github/workflows/repair-current-unmatched.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare current unmatched repair list [repair-current-unmatched]'
          git push origin HEAD:agent/repair-skill-pack-import
