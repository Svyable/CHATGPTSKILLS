name: Audit historical file sources

on:
  push:
    branches:
      - agent/repair-skill-pack-import
    paths:
      - '.github/workflows/repair-history-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-skill-pack-import
          fetch-depth: 0

      - name: Clone candidate repositories with history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/history
          clone_history() {
            local label="$1" url="$2"
            git clone --filter=blob:none --no-checkout "$url" "/tmp/history/$label" || true
          }
          clone_history lightspeed https://github.com/lightspeedwp/.github.git
          clone_history vercel-plugin https://github.com/vercel/vercel-plugin.git
          clone_history vercel-agent-skills https://github.com/vercel-labs/agent-skills.git
          clone_history openai-skills https://github.com/openai/skills.git
          clone_history openai-codex https://github.com/openai/codex.git
          clone_history anthropic-skills https://github.com/anthropics/skills.git
          clone_history supabase-agent-skills https://github.com/supabase/agent-skills.git
          clone_history sentry-mcp https://github.com/getsentry/sentry-mcp.git

      - name: Match unmatched blobs in full history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          report_path = Path('.repair/file-source-audit.tsv')
          lines = report_path.read_text().splitlines()
          header, rows = lines[0], [line.split('\t') for line in lines[1:]]
          wanted = {r[2] for r in rows if r[1] == 'UNMATCHED'}
          matches = {}

          root = Path('/tmp/history')
          for repo in sorted(p for p in root.iterdir() if p.is_dir()):
              try:
                  head = subprocess.check_output(['git','-C',str(repo),'rev-parse','HEAD'], text=True).strip()
                  listing = subprocess.check_output(['git','-C',str(repo),'rev-list','--objects','--all'], text=True, errors='replace')
              except Exception:
                  continue
              for line in listing.splitlines():
                  oid, _, path = line.partition(' ')
                  if oid in wanted and oid not in matches:
                      matches[oid] = (repo.name, head, path)

          recovered = 0
          recovered_bytes = 0
          out = [header]
          for r in rows:
              if r[1] == 'UNMATCHED' and r[2] in matches:
                  source, head, path = matches[r[2]]
                  r[1] = 'MATCH_HISTORY'
                  r[4:] = [source, head, path]
                  recovered += 1
                  recovered_bytes += int(r[3])
              out.append('\t'.join(r))

          report_path.write_text('\n'.join(out) + '\n')
          remaining = [r for r in rows if r[1] == 'UNMATCHED']
          Path('.repair/history-audit-summary.txt').write_text(
              f'recovered={recovered}\n'
              f'recovered_bytes={recovered_bytes}\n'
              f'remaining_unmatched={len(remaining)}\n'
              f'remaining_unmatched_bytes={sum(int(r[3]) for r in remaining)}\n'
          )
          print(Path('.repair/history-audit-summary.txt').read_text())
          PY

      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-history-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Recover exact files from source history [repair-history-audit]'
          git push origin HEAD:agent/repair-skill-pack-import
