name: Repair workflow probe

on:
  push:
    branches:
      - agent/repair-skill-pack-import
    paths:
      - '.github/workflows/repair-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-skill-pack-import
          fetch-depth: 0

      - name: Record successful workflow execution
        shell: bash
        run: |
          set -euo pipefail
          printf 'ok\n' > .repair-action-ok
          rm -f .github/workflows/repair-probe.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Verify repair workflow execution [repair-probe]'
          git push origin HEAD:agent/repair-skill-pack-import
