name: Audit exact file sources

on:
  push:
    branches:
      - agent/repair-skill-pack-import
    paths:
      - '.github/workflows/repair-file-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-skill-pack-import
          fetch-depth: 0

      - name: Decode expected file fingerprints
        shell: bash
        run: |
          set -euo pipefail
          cat .repair/file-blobs/part-000 .repair/file-blobs/part-001 > /tmp/file-blobs.tsv.gz.b64
          echo '5cb46033f8c6b66a35681d93f946779034c18859c497b226ec7b6a31375ec83a  /tmp/file-blobs.tsv.gz.b64' | sha256sum -c -
          base64 -d /tmp/file-blobs.tsv.gz.b64 | gzip -d > /tmp/file-blobs.tsv
          test "$(wc -l < /tmp/file-blobs.tsv)" -eq 573

      - name: Fetch candidate public sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sources

          clone_head() {
            local label="$1" url="$2"
            git clone --depth 1 "$url" "/tmp/sources/$label" || true
          }

          clone_pinned() {
            local label="$1" url="$2" ref="$3"
            mkdir -p "/tmp/sources/$label"
            git -C "/tmp/sources/$label" init -q
            git -C "/tmp/sources/$label" remote add origin "$url"
            git -C "/tmp/sources/$label" fetch --depth 1 origin "$ref"
            git -C "/tmp/sources/$label" checkout -q FETCH_HEAD
          }

          clone_pinned lightspeed https://github.com/lightspeedwp/.github.git a14b5adb1db5c88a3dbd863034035ad88332c522
          clone_pinned openai-codex https://github.com/openai/codex.git bbcf5e10fb493f0f46e4155455e1b5c4f69cfe63
          clone_head vercel-plugin https://github.com/vercel/vercel-plugin.git
          clone_head vercel-agent-skills https://github.com/vercel-labs/agent-skills.git
          clone_head openai-skills https://github.com/openai/skills.git
          clone_head anthropic-skills https://github.com/anthropics/skills.git
          clone_head supabase-agent-skills https://github.com/supabase/agent-skills.git
          clone_head sentry-mcp https://github.com/getsentry/sentry-mcp.git

      - name: Match exact file blobs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          rows = []
          expected_blobs = set()
          for line in Path('/tmp/file-blobs.tsv').read_text().splitlines():
              target, blob, size = line.split('\t')
              rows.append((target, blob, int(size)))
              expected_blobs.add(blob)

          def git_blob(path: Path) -> str:
              data = path.read_bytes()
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          matches = {}
          source_meta = {}
          root = Path('/tmp/sources')
          for repo in sorted(p for p in root.iterdir() if p.is_dir()):
              try:
                  commit = subprocess.check_output(
                      ['git', '-C', str(repo), 'rev-parse', 'HEAD'], text=True
                  ).strip()
              except Exception:
                  continue
              source_meta[repo.name] = commit
              for path in sorted(p for p in repo.rglob('*') if p.is_file() and '.git' not in p.parts):
                  try:
                      blob = git_blob(path)
                  except OSError:
                      continue
                  if blob in expected_blobs and blob not in matches:
                      matches[blob] = (
                          repo.name,
                          commit,
                          path.relative_to(repo).as_posix(),
                      )

          out = ['target\tstatus\tblob\tsize\tsource\tcommit\tpath']
          matched = 0
          matched_bytes = 0
          for target, blob, size in rows:
              if blob in matches:
                  source, commit, path = matches[blob]
                  out.append(f'{target}\tMATCH\t{blob}\t{size}\t{source}\t{commit}\t{path}')
                  matched += 1
                  matched_bytes += size
              else:
                  out.append(f'{target}\tUNMATCHED\t{blob}\t{size}\t\t\t')
          Path('.repair/file-source-audit.tsv').write_text('\n'.join(out) + '\n')
          Path('.repair/file-source-audit-summary.txt').write_text(
              f'matched={matched}\n'
              f'unmatched={len(rows)-matched}\n'
              f'total={len(rows)}\n'
              f'matched_bytes={matched_bytes}\n'
              f'unmatched_bytes={sum(size for _,_,size in rows)-matched_bytes}\n'
          )
          print(Path('.repair/file-source-audit-summary.txt').read_text())
          PY

      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-file-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Audit exact public file sources [repair-file-audit]'
          git push origin HEAD:agent/repair-skill-pack-import
