name: Audit inherited staging payload

on:
  push:
    branches:
      - agent/repair-skill-pack-import
    paths:
      - '.github/workflows/repair-staging-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-skill-pack-import
          fetch-depth: 0

      - name: Inspect inherited staging files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .repair
          {
            echo -e 'path\tbytes\tsha256\tfile_type\tprefix'
            find .upload -maxdepth 1 -type f -print0 | sort -z | while IFS= read -r -d '' file; do
              bytes=$(wc -c < "$file")
              sha=$(sha256sum "$file" | awk '{print $1}')
              kind=$(file -b "$file" | tr '\t\n' '  ')
              prefix=$(head -c 80 "$file" | base64 -w0)
              printf '%s\t%s\t%s\t%s\t%s\n' "$file" "$bytes" "$sha" "$kind" "$prefix"
            done
          } > .repair/staging-files.tsv

          : > .repair/staging-archive-report.txt
          if compgen -G '.upload/part-*' > /dev/null; then
            cat .upload/part-* > /tmp/parts.b64
            echo "parts_base64_bytes=$(wc -c < /tmp/parts.b64)" >> .repair/staging-archive-report.txt
            if base64 -d /tmp/parts.b64 > /tmp/parts.bin 2>/tmp/base64.err; then
              echo "parts_base64_decode=ok" >> .repair/staging-archive-report.txt
              echo "parts_binary_bytes=$(wc -c < /tmp/parts.bin)" >> .repair/staging-archive-report.txt
              echo "parts_binary_sha256=$(sha256sum /tmp/parts.bin | awk '{print $1}')" >> .repair/staging-archive-report.txt
              echo "parts_binary_type=$(file -b /tmp/parts.bin)" >> .repair/staging-archive-report.txt
              if xz -t /tmp/parts.bin 2>/tmp/xz.err; then
                echo "parts_xz_test=ok" >> .repair/staging-archive-report.txt
                tar -tJf /tmp/parts.bin | sort > .repair/staging-archive-files.txt
                echo "parts_tar_files=$(wc -l < .repair/staging-archive-files.txt)" >> .repair/staging-archive-report.txt
              else
                echo "parts_xz_test=failed" >> .repair/staging-archive-report.txt
                sed 's/^/xz_error=/' /tmp/xz.err >> .repair/staging-archive-report.txt
              fi
            else
              echo "parts_base64_decode=failed" >> .repair/staging-archive-report.txt
              sed 's/^/base64_error=/' /tmp/base64.err >> .repair/staging-archive-report.txt
            fi
          fi

          for file in .upload/supplement.br .upload/supplement.tar.xz; do
            [ -f "$file" ] || continue
            echo "supplement_file=$file" >> .repair/staging-archive-report.txt
            echo "supplement_bytes=$(wc -c < "$file")" >> .repair/staging-archive-report.txt
            echo "supplement_type=$(file -b "$file")" >> .repair/staging-archive-report.txt
            if xz -t "$file" 2>/dev/null; then
              echo "supplement_xz_test=ok" >> .repair/staging-archive-report.txt
            fi
          done

      - name: Commit staging audit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-staging-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Audit inherited staging payload [repair-staging-audit]'
          git push origin HEAD:agent/repair-skill-pack-import
