name: Audit partial residual payload

on:
  push:
    branches:
      - agent/repair-skill-pack-import
    paths:
      - '.github/workflows/repair-partial-payload-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-skill-pack-import
          fetch-depth: 0

      - name: Recover exact files from uploaded payload prefix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .repair/current-payload/part-010 .repair/local-file-probe
          cat .repair/current-payload/part-00{0..9} > /tmp/current-prefix.xz.b64
          base64 -d /tmp/current-prefix.xz.b64 > /tmp/current-prefix.xz
          mkdir -p /tmp/current-prefix
          set +e
          xz -dc /tmp/current-prefix.xz > /tmp/current-prefix.tar 2>/tmp/current-prefix-xz-error.txt
          tar -xf /tmp/current-prefix.tar -C /tmp/current-prefix --ignore-zeros 2>/tmp/current-prefix-tar-error.txt
          set -e

          python - <<'PY'
          from pathlib import Path
          import hashlib

          report_path = Path('.repair/file-source-audit.tsv')
          lines = report_path.read_text().splitlines()
          header, rows = lines[0], [line.split('\t') for line in lines[1:]]
          root = Path('/tmp/current-prefix')

          def git_blob(path: Path) -> str:
              data = path.read_bytes()
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          recovered = 0
          recovered_bytes = 0
          out = [header]
          for r in rows:
              target, status, expected_blob, size = r[:4]
              candidate = root / target
              if status == 'UNMATCHED' and candidate.is_file() and candidate.stat().st_size == int(size) and git_blob(candidate) == expected_blob:
                  r[1] = 'MATCH_PARTIAL_PAYLOAD'
                  r[4:] = ['current-payload-prefix', 'parts-000-009', target]
                  recovered += 1
                  recovered_bytes += int(size)
              out.append('\t'.join(r))

          report_path.write_text('\n'.join(out) + '\n')
          remaining = [r for r in rows if r[1] == 'UNMATCHED']
          Path('.repair/partial-payload-audit-summary.txt').write_text(
              f'recovered={recovered}\n'
              f'recovered_bytes={recovered_bytes}\n'
              f'remaining_unmatched={len(remaining)}\n'
              f'remaining_unmatched_bytes={sum(int(r[3]) for r in remaining)}\n'
          )
          Path('.repair/current-prefix-xz-error.txt').write_text(Path('/tmp/current-prefix-xz-error.txt').read_text(errors='replace'))
          Path('.repair/current-prefix-tar-error.txt').write_text(Path('/tmp/current-prefix-tar-error.txt').read_text(errors='replace'))
          print(Path('.repair/partial-payload-audit-summary.txt').read_text())
          PY

      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-partial-payload-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Recover exact files from uploaded payload prefix [repair-partial-payload-audit]'
          git push origin HEAD:agent/repair-skill-pack-import
