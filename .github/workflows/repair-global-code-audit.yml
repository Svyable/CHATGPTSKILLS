name: Recover exact files from global code search

on:
  push:
    branches:
      - agent/repair-skill-pack-import
    paths:
      - '.github/workflows/repair-global-code-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-skill-pack-import
          fetch-depth: 0

      - name: Find exact blobs through global code search
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          import time

          report_path = Path('.repair/file-source-audit.tsv')
          lines = report_path.read_text().splitlines()
          header = lines[0]
          rows = [line.split('\t') for line in lines[1:]]
          unmatched = [r for r in rows if r[1] == 'UNMATCHED']

          def search(q):
              for attempt in range(5):
                  p = subprocess.run(
                      ['gh','api','-X','GET','search/code','-f',f'q={q}','-f','per_page=100'],
                      text=True, capture_output=True,
                  )
                  if p.returncode == 0:
                      try:
                          return json.loads(p.stdout).get('items', [])
                      except json.JSONDecodeError:
                          return []
                  wait = 65 if 'rate limit' in (p.stderr or '').lower() else 8
                  time.sleep(wait)
              return []

          found = {}
          for idx, r in enumerate(unmatched, 1):
              target, _, expected_blob, _ = r[:4]
              parts = Path(target).parts
              basename = parts[-1]
              parent = parts[-2] if len(parts) > 1 else ''
              skill = ''
              if 'skills' in parts:
                  i = parts.index('skills')
                  if i + 1 < len(parts):
                      skill = parts[i+1]
              elif len(parts) > 1:
                  skill = parts[1]

              queries = []
              if basename == 'SKILL.md':
                  queries.extend([
                      f'filename:SKILL.md path:{skill}',
                      f'filename:SKILL.md "{skill}"',
                  ])
              else:
                  queries.extend([
                      f'filename:{basename} path:{parent}',
                      f'filename:{basename} path:{skill}',
                  ])
              seen = set()
              for q in queries:
                  if q in seen or not q.strip():
                      continue
                  seen.add(q)
                  items = search(q)
                  for item in items:
                      if item.get('sha') == expected_blob:
                          found[expected_blob] = (
                              item['repository']['full_name'],
                              item['path'],
                          )
                          break
                  if expected_blob in found:
                      break
                  time.sleep(7)
              print(f'{idx}/{len(unmatched)} exact_matches={len(found)}', flush=True)

          out = [header]
          recovered = 0
          recovered_bytes = 0
          for r in rows:
              if r[1] == 'UNMATCHED' and r[2] in found:
                  repo, path = found[r[2]]
                  r[1] = 'MATCH_CODE_SEARCH'
                  r[4:] = [repo, r[2], path]
                  recovered += 1
                  recovered_bytes += int(r[3])
              out.append('\t'.join(r))
          report_path.write_text('\n'.join(out) + '\n')
          remaining = [r for r in rows if r[1] == 'UNMATCHED']
          Path('.repair/global-code-audit-summary.txt').write_text(
              f'recovered={recovered}\n'
              f'recovered_bytes={recovered_bytes}\n'
              f'remaining_unmatched={len(remaining)}\n'
              f'remaining_unmatched_bytes={sum(int(r[3]) for r in remaining)}\n'
          )
          print(Path('.repair/global-code-audit-summary.txt').read_text())
          PY

      - name: Commit exact-match report
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-global-code-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Recover exact files from global code search [repair-global-code-audit]'
          git pull --rebase origin agent/repair-skill-pack-import
          git push origin HEAD:agent/repair-skill-pack-import
