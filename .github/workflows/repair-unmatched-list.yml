name: Prepare unmatched repair list

on:
  push:
    branches:
      - agent/repair-skill-pack-import
    paths:
      - '.github/workflows/repair-unmatched-list.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-skill-pack-import
          fetch-depth: 0
      - name: Prepare compact unmatched list
        shell: bash
        run: |
          set -euo pipefail
          awk -F '\t' 'NR > 1 && $2 == "UNMATCHED" {print $1}' .repair/file-source-audit.tsv > /tmp/unmatched-paths.txt
          test "$(wc -l < /tmp/unmatched-paths.txt)" -eq 226
          gzip -9c /tmp/unmatched-paths.txt | base64 -w0 > .repair/unmatched-paths.txt.gz.b64
          sha256sum /tmp/unmatched-paths.txt > .repair/unmatched-paths.sha256
          rm -f .github/workflows/repair-unmatched-list.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare unmatched repair list [repair-unmatched-list]'
          git push origin HEAD:agent/repair-skill-pack-import
