name: Finalize verified repair pull request v2

on:
  push:
    branches:
      - agent/repair-skill-pack-import
    paths:
      - '.github/workflows/repair-finalize-pr-v2.yml'

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: agent/repair-skill-pack-import
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-skill-pack-import
          fetch-depth: 0

      - name: Recover immutable manifest from branch history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          manifest_commit="$(git log --all --format=%H -- .repair/file-blobs/part-000 | head -1)"
          test -n "$manifest_commit"
          git show "$manifest_commit:.repair/file-blobs/part-000" > /tmp/manifest-000
          git show "$manifest_commit:.repair/file-blobs/part-001" > /tmp/manifest-001
          cat /tmp/manifest-000 /tmp/manifest-001 > /tmp/file-blobs.tsv.gz.b64
          echo '5cb46033f8c6b66a35681d93f946779034c18859c497b226ec7b6a31375ec83a  /tmp/file-blobs.tsv.gz.b64' | sha256sum -c -
          base64 -d /tmp/file-blobs.tsv.gz.b64 | gzip -d > /tmp/file-blobs.tsv
          test "$(wc -l < /tmp/file-blobs.tsv)" -eq 573

      - name: Wait for recovery jobs and exact source tree
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 360); do
            git fetch origin "$BRANCH"
            ref="origin/$BRANCH"
            rm -rf /tmp/check && mkdir -p /tmp/check
            git archive "$ref" | tar -x -C /tmp/check

            if python - <<'PY'
          from pathlib import Path
          import hashlib, sys
          root=Path('/tmp/check')
          for line in Path('/tmp/file-blobs.tsv').read_text().splitlines():
              target, expected, size=line.split('\t')
              p=root/target
              if not p.is_file(): sys.exit(1)
              data=p.read_bytes()
              actual=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
              if len(data)!=int(size) or actual!=expected: sys.exit(1)
          PY
            then
              others="$(gh api -X GET 'repos/Svyable/CHATGPTSKILLS/actions/runs' -f branch="$BRANCH" -f per_page=100 --jq '.workflow_runs[] | select((.status == "queued" or .status == "in_progress") and (.name != "Finalize verified repair pull request") and (.name != "Finalize verified repair pull request v2")) | .id' || true)"
              if [ -z "$others" ]; then
                ready=true
                break
              fi
            fi
            sleep 30
          done
          test "$ready" = true

      - name: Remove every repair artifact and verify clean tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          rm -rf .repair .upload .github .repair-action-ok
          rm -f .repair-action-ok .repair/local-file-probe .repair/native-upload-note.txt .repair/upload-capability-probe.txt .repair/ignore-this-probe

          python - <<'PY'
          from pathlib import Path
          import hashlib, sys
          root=Path('.')
          expected={}
          for line in Path('/tmp/file-blobs.tsv').read_text().splitlines():
              target, blob, size=line.split('\t')
              expected[target]=(blob,int(size))
          actual={str(p) for p in root.rglob('*') if p.is_file() and '.git' not in p.parts}
          if actual != set(expected):
              print('missing', sorted(set(expected)-actual))
              print('extra', sorted(actual-set(expected)))
              sys.exit(1)
          for target,(blob,size) in expected.items():
              data=(root/target).read_bytes()
              actual_blob=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
              if len(data)!=size or actual_blob!=blob:
                  raise SystemExit(f'mismatch: {target}')
          assert len(actual)==573
          assert sum(1 for p in actual if p.endswith('/SKILL.md'))==74
          assert 'README.md' in actual
          print('Exact clean tree verified: 573 files, 74 skills, 8 packs')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize clean verified skill import repair' || true
          git pull --rebase origin "$BRANCH"
          git push origin HEAD:"$BRANCH"

      - name: Confirm remote remains clean
        shell: bash
        run: |
          set -euo pipefail
          sleep 45
          git fetch origin "$BRANCH"
          mapfile -t files < <(git ls-tree -r --name-only "origin/$BRANCH")
          test "${#files[@]}" -eq 573
          test "$(printf '%s\n' "${files[@]}" | grep -c '/SKILL.md$')" -eq 74
          test "$(printf '%s\n' "${files[@]}" | grep -Ec '^(\.repair/|\.upload/|\.github/|\.repair-action-ok$)' || true)" -eq 0
          git cat-file -e "origin/$BRANCH:README.md"

      - name: Open or update repair pull request
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<'BODY'
          ## What changed

          - Replaces the mistakenly merged staging-only import with the exact validated source tree from the original uploads.
          - Restores eight skill packs containing 74 `SKILL.md` definitions and all companion scripts, references, templates, examples, and preview assets.
          - Adds the original top-level `README.md`.
          - Removes `.upload`, temporary workflows, transport probes, and all repair metadata.

          ## Integrity and provenance

          - Final tree: **573 files** total — README plus **572 uploaded source files**.
          - Every final file is verified against its original Git blob SHA and byte size.
          - Exact files are recovered only from checksum-matching public repository objects, validated archive prefixes, or checksum-locked residual source data.
          - No newer upstream substitutions or merely similar files are accepted.

          ## Validation

          - 8 expected top-level pack directories.
          - Exactly 74 `SKILL.md` files.
          - Exactly 573 files and no extras.
          - No `.upload`, `.repair`, `.github`, or probe files remain.
          - Full manifest verification passes byte-for-byte.

          This PR intentionally remains unmerged for review.
          BODY
          number="$(gh pr list --repo Svyable/CHATGPTSKILLS --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo Svyable/CHATGPTSKILLS --title 'Repair skill pack import' --body-file /tmp/pr-body.md
            url="$(gh pr view "$number" --repo Svyable/CHATGPTSKILLS --json url --jq .url)"
          else
            url="$(gh pr create --repo Svyable/CHATGPTSKILLS --base main --head "$BRANCH" --title 'Repair skill pack import' --body-file /tmp/pr-body.md)"
          fi
          printf 'Verified repair PR: %s\n' "$url" | tee -a "$GITHUB_STEP_SUMMARY"
