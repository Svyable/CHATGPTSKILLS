name: Audit exact skill sources

on:
  push:
    branches:
      - agent/repair-skill-pack-import
    paths:
      - '.github/workflows/repair-source-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-skill-pack-import
          fetch-depth: 0

      - name: Decode expected fingerprints
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .repair/fingerprints.tsv.gz.b64 | gzip -d > /tmp/fingerprints.tsv
          test "$(wc -l < /tmp/fingerprints.tsv)" -eq 74

      - name: Fetch candidate public sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sources

          clone_head() {
            local label="$1" url="$2"
            git clone --depth 1 --filter=blob:none "$url" "/tmp/sources/$label" || true
          }

          clone_pinned() {
            local label="$1" url="$2" ref="$3"
            mkdir -p "/tmp/sources/$label"
            git -C "/tmp/sources/$label" init -q
            git -C "/tmp/sources/$label" remote add origin "$url"
            git -C "/tmp/sources/$label" fetch --depth 1 origin "$ref"
            git -C "/tmp/sources/$label" checkout -q FETCH_HEAD
          }

          clone_pinned lightspeed https://github.com/lightspeedwp/.github.git a14b5adb1db5c88a3dbd863034035ad88332c522
          clone_head vercel-plugin https://github.com/vercel/vercel-plugin.git
          clone_head vercel-agent-skills https://github.com/vercel-labs/agent-skills.git
          clone_head openai-skills https://github.com/openai/skills.git
          clone_head openai-codex https://github.com/openai/codex.git
          clone_head anthropic-skills https://github.com/anthropics/skills.git
          clone_head supabase-agent-skills https://github.com/supabase/agent-skills.git
          clone_head sentry-mcp https://github.com/getsentry/sentry-mcp.git

      - name: Match exact directory fingerprints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          expected = []
          for line in Path('/tmp/fingerprints.tsv').read_text().splitlines():
              target, skill_blob, dir_hash, file_count, total_bytes = line.split('\t')
              expected.append({
                  'target': target,
                  'skill_blob': skill_blob,
                  'dir_hash': dir_hash,
                  'file_count': int(file_count),
                  'total_bytes': int(total_bytes),
              })

          by_blob = {}
          for row in expected:
              by_blob.setdefault(row['skill_blob'], []).append(row)

          def git_blob(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          def fingerprint(directory: Path):
              entries = []
              total = 0
              count = 0
              for path in sorted(p for p in directory.rglob('*') if p.is_file() and '.git' not in p.parts):
                  data = path.read_bytes()
                  rel = path.relative_to(directory).as_posix()
                  entries.append(f'{rel}\t{hashlib.sha256(data).hexdigest()}')
                  total += len(data)
                  count += 1
              digest = hashlib.sha256(('\n'.join(entries) + '\n').encode()).hexdigest()
              return digest, count, total

          matches = {}
          source_root = Path('/tmp/sources')
          for repo_dir in sorted(p for p in source_root.iterdir() if p.is_dir()):
              try:
                  commit = __import__('subprocess').check_output(
                      ['git', '-C', str(repo_dir), 'rev-parse', 'HEAD'], text=True
                  ).strip()
              except Exception:
                  continue
              for skill_file in repo_dir.rglob('SKILL.md'):
                  if '.git' in skill_file.parts:
                      continue
                  data = skill_file.read_bytes()
                  blob = git_blob(data)
                  rows = by_blob.get(blob)
                  if not rows:
                      continue
                  actual_hash, actual_count, actual_bytes = fingerprint(skill_file.parent)
                  for row in rows:
                      if row['target'] in matches:
                          continue
                      if (
                          actual_hash == row['dir_hash']
                          and actual_count == row['file_count']
                          and actual_bytes == row['total_bytes']
                      ):
                          matches[row['target']] = (
                              repo_dir.name,
                              commit,
                              skill_file.parent.relative_to(repo_dir).as_posix(),
                          )

          lines = ['target\tstatus\tsource\tcommit\tpath']
          for row in expected:
              target = row['target']
              if target in matches:
                  source, commit, path = matches[target]
                  lines.append(f'{target}\tMATCH\t{source}\t{commit}\t{path}')
              else:
                  lines.append(f'{target}\tUNMATCHED\t\t\t')
          Path('.repair/source-audit.tsv').write_text('\n'.join(lines) + '\n')
          Path('.repair/source-audit-summary.txt').write_text(
              f"matched={len(matches)}\nunmatched={len(expected) - len(matches)}\ntotal={len(expected)}\n"
          )
          print(Path('.repair/source-audit-summary.txt').read_text())
          PY

      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-source-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Audit exact public skill sources [repair-source-audit]'
          git push origin HEAD:agent/repair-skill-pack-import
