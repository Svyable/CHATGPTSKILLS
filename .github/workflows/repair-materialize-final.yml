name: Materialize verified skill import repair

on:
  push:
    branches:
      - agent/repair-skill-pack-import
    paths:
      - '.github/workflows/repair-materialize-final.yml'

permissions:
  contents: write

concurrency:
  group: repair-skill-pack-import
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-skill-pack-import
          fetch-depth: 0

      - name: Decode exact manifest and archive prefixes
        shell: bash
        run: |
          set -euo pipefail
          cat .repair/file-blobs/part-000 .repair/file-blobs/part-001 > /tmp/file-blobs.tsv.gz.b64
          echo '5cb46033f8c6b66a35681d93f946779034c18859c497b226ec7b6a31375ec83a  /tmp/file-blobs.tsv.gz.b64' | sha256sum -c -
          base64 -d /tmp/file-blobs.tsv.gz.b64 | gzip -d > /tmp/file-blobs.tsv
          test "$(wc -l < /tmp/file-blobs.tsv)" -eq 573

          cat .upload/part-* > /tmp/prefix.xz.b64
          base64 -d /tmp/prefix.xz.b64 > /tmp/prefix.xz
          mkdir -p /tmp/prefix
          set +e
          xz -dc /tmp/prefix.xz > /tmp/prefix.tar 2>/tmp/prefix-xz-error.txt
          tar -xf /tmp/prefix.tar -C /tmp/prefix --ignore-zeros 2>/tmp/prefix-tar-error.txt
          set -e

          cat .repair/current-payload/part-00{0..9} > /tmp/current-prefix.xz.b64
          base64 -d /tmp/current-prefix.xz.b64 > /tmp/current-prefix.xz
          mkdir -p /tmp/current-prefix
          set +e
          xz -dc /tmp/current-prefix.xz > /tmp/current-prefix.tar 2>/tmp/current-prefix-xz-error.txt
          tar -xf /tmp/current-prefix.tar -C /tmp/current-prefix --ignore-zeros 2>/tmp/current-prefix-tar-error.txt
          set -e

      - name: Seed exact files from audited sources and prefixes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil

          manifest = {}
          for line in Path('/tmp/file-blobs.tsv').read_text().splitlines():
              target, blob, size = line.split('\t')
              manifest[target] = (blob, int(size))

          def git_blob(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          def exact_copy(source: Path, target: str) -> bool:
              if not source.is_file() or target not in manifest:
                  return False
              data = source.read_bytes()
              blob, size = manifest[target]
              if len(data) != size or git_blob(data) != blob:
                  return False
              dest = Path('/tmp/final') / target
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              return True

          audit = Path('.repair/file-source-audit.tsv')
          api_rows = []
          if audit.exists():
              for line in audit.read_text().splitlines()[1:]:
                  cols = line.split('\t')
                  cols += [''] * (7 - len(cols))
                  target, status, blob, size, source, commit, path = cols[:7]
                  if status == 'MATCH_PREFIX':
                      exact_copy(Path('/tmp/prefix') / target, target)
                  elif status == 'MATCH_PARTIAL_PAYLOAD':
                      exact_copy(Path('/tmp/current-prefix') / target, target)
                  elif status.startswith('MATCH'):
                      api_rows.append((target, blob, source, path))

          # Independently accept any exact file present in either recovered prefix.
          for target in manifest:
              dest = Path('/tmp/final') / target
              if dest.exists():
                  continue
              if exact_copy(Path('/tmp/current-prefix') / target, target):
                  continue
              exact_copy(Path('/tmp/prefix') / target, target)

          Path('/tmp/api-needed.tsv').write_text(
              ''.join('\t'.join(row) + '\n' for row in api_rows)
          )
          PY

          repo_for_source() {
            case "$1" in
              lightspeed) echo 'lightspeedwp/.github' ;;
              openai-codex) echo 'openai/codex' ;;
              vercel-plugin) echo 'vercel/vercel-plugin' ;;
              vercel-agent-skills) echo 'vercel-labs/agent-skills' ;;
              openai-skills) echo 'openai/skills' ;;
              anthropic-skills) echo 'anthropics/skills' ;;
              supabase-agent-skills) echo 'supabase/agent-skills' ;;
              sentry-mcp) echo 'getsentry/sentry-mcp' ;;
              */*) echo "$1" ;;
              *) echo '' ;;
            esac
          }

          while IFS=$'\t' read -r target blob source path; do
            [ -n "$target" ] || continue
            [ -f "/tmp/final/$target" ] && continue
            repo="$(repo_for_source "$source")"
            [ -n "$repo" ] || continue
            mkdir -p "/tmp/final/$(dirname "$target")"
            if gh api "repos/$repo/git/blobs/$blob" --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d > "/tmp/final/$target.tmp"; then
              mv "/tmp/final/$target.tmp" "/tmp/final/$target"
            else
              rm -f "/tmp/final/$target.tmp"
            fi
          done < /tmp/api-needed.tsv

      - name: Recover remaining exact blobs from candidate object stores
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('/tmp/final')
          missing=[]
          for line in Path('/tmp/file-blobs.tsv').read_text().splitlines():
              target, blob, size = line.split('\t')
              p=root/target
              ok=False
              if p.is_file():
                  data=p.read_bytes()
                  actual=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
                  ok=len(data)==int(size) and actual==blob
              if not ok:
                  p.unlink(missing_ok=True)
                  missing.append((target,blob,size))
          Path('/tmp/missing.tsv').write_text(''.join('\t'.join(r)+'\n' for r in missing))
          print(f'missing before object-store recovery: {len(missing)}')
          PY

          repos=(
            lightspeedwp/.github
            vercel/vercel-plugin
            vercel-labs/agent-skills
            openai/skills
            openai/codex
            anthropics/skills
            supabase/agent-skills
            getsentry/sentry-mcp
            Svyable/CHATGPTSKILLS
          )
          while IFS=$'\t' read -r target blob size; do
            [ -n "$target" ] || continue
            mkdir -p "/tmp/final/$(dirname "$target")"
            for repo in "${repos[@]}"; do
              if gh api "repos/$repo/git/blobs/$blob" --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d > "/tmp/final/$target.tmp"; then
                mv "/tmp/final/$target.tmp" "/tmp/final/$target"
                break
              fi
              rm -f "/tmp/final/$target.tmp"
            done
          done < /tmp/missing.tsv

      - name: Recover final exact blobs through global code search
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json
          import subprocess
          import time

          root=Path('/tmp/final')
          manifest=[]
          for line in Path('/tmp/file-blobs.tsv').read_text().splitlines():
              target, blob, size=line.split('\t')
              manifest.append((target,blob,int(size)))

          def blob_sha(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()

          def exact(path,target,blob,size):
              if not path.is_file(): return False
              data=path.read_bytes()
              return len(data)==size and blob_sha(data)==blob

          missing=[]
          for target,blob,size in manifest:
              p=root/target
              if not exact(p,target,blob,size):
                  p.unlink(missing_ok=True)
                  missing.append((target,blob,size))
          print(f'missing before global search: {len(missing)}', flush=True)

          def api(args, attempts=6):
              for attempt in range(attempts):
                  p=subprocess.run(['gh','api',*args],text=True,capture_output=True)
                  if p.returncode==0:
                      return p.stdout
                  err=(p.stderr or '').lower()
                  time.sleep(65 if 'rate limit' in err else min(30,5*(attempt+1)))
              return None

          recovered=0
          for idx,(target,expected,size) in enumerate(missing,1):
              parts=Path(target).parts
              basename=parts[-1]
              parent=parts[-2] if len(parts)>1 else ''
              skill=''
              if 'skills' in parts:
                  i=parts.index('skills')
                  if i+1<len(parts): skill=parts[i+1]
              elif len(parts)>1:
                  skill=parts[1]
              queries=[]
              if basename=='SKILL.md':
                  queries=[f'filename:SKILL.md path:{skill}',f'filename:SKILL.md "{skill}"']
              else:
                  queries=[f'filename:{basename} path:{parent}',f'filename:{basename} path:{skill}']
              matched=None
              for q in dict.fromkeys(q for q in queries if q and not q.endswith('path:')):
                  raw=api(['-X','GET','search/code','-f',f'q={q}','-f','per_page=100'])
                  if raw:
                      try: items=json.loads(raw).get('items',[])
                      except json.JSONDecodeError: items=[]
                      for item in items:
                          if item.get('sha')==expected:
                              matched=(item['repository']['full_name'],item['sha'])
                              break
                  if matched: break
                  time.sleep(7)
              if matched:
                  repo,sha=matched
                  raw=api([f'repos/{repo}/git/blobs/{sha}'])
                  if raw:
                      obj=json.loads(raw)
                      data=base64.b64decode(obj['content'])
                      if len(data)==size and blob_sha(data)==expected:
                          dest=root/target
                          dest.parent.mkdir(parents=True,exist_ok=True)
                          dest.write_bytes(data)
                          recovered+=1
              print(f'{idx}/{len(missing)} global_recovered={recovered}',flush=True)

          still=[]
          for target,blob,size in manifest:
              p=root/target
              if not exact(p,target,blob,size):
                  still.append((target,blob,str(size)))
          Path('/tmp/still-missing.tsv').write_text(''.join('\t'.join(r)+'\n' for r in still))
          print(f'still missing: {len(still)}',flush=True)
          PY

      - name: Verify exact final source tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import sys

          root=Path('/tmp/final')
          expected={}
          for line in Path('/tmp/file-blobs.tsv').read_text().splitlines():
              target,blob,size=line.split('\t')
              expected[target]=(blob,int(size))

          errors=[]
          for target,(blob,size) in expected.items():
              p=root/target
              if not p.is_file():
                  errors.append(f'MISSING\t{target}')
                  continue
              data=p.read_bytes()
              actual=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
              if len(data)!=size or actual!=blob:
                  errors.append(f'MISMATCH\t{target}\t{len(data)}\t{actual}')
          actual_files={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          for extra in sorted(actual_files-set(expected)):
              errors.append(f'EXTRA\t{extra}')

          Path('/tmp/verification-errors.tsv').write_text('\n'.join(errors)+('\n' if errors else ''))
          if errors:
              print(f'Exact verification failed: {len(errors)} errors')
              sys.exit(42)

          assert len(actual_files)==573
          assert sum(1 for p in actual_files if p.endswith('/SKILL.md') or p=='SKILL.md')==74
          assert 'README.md' in actual_files
          roots={p.split('/',1)[0] for p in actual_files if '/' in p}
          required={
            'local-github-agentic-loop-pack','ai-agent-documents-creative-skills',
            'ai-agent-ui-product-skills','ai-agent-large-project-engineering-skills',
            'ai-agent-production-saas-skills','ai-agent-ai-app-skills',
            'ai-agent-web-engineering-skills','ai-agent-core-skills'
          }
          assert required <= roots
          Path('/tmp/verification-summary.txt').write_text(
              'files=573\nskills=74\npacks=8\nmanifest=exact\n'
          )
          print(Path('/tmp/verification-summary.txt').read_text())
          PY

      - name: Commit verified clean repair
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            local-github-agentic-loop-pack \
            ai-agent-documents-creative-skills \
            ai-agent-ui-product-skills \
            ai-agent-large-project-engineering-skills \
            ai-agent-production-saas-skills \
            ai-agent-ai-app-skills \
            ai-agent-web-engineering-skills \
            ai-agent-core-skills \
            README.md .upload .repair .github .repair-action-ok
          cp -a /tmp/final/. .
          test "$(find . -type f -not -path './.git/*' | wc -l)" -eq 573
          test "$(find . -type f -name SKILL.md -not -path './.git/*' | wc -l)" -eq 74
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair skill pack import with verified source tree'
          git pull --rebase origin agent/repair-skill-pack-import
          git push origin HEAD:agent/repair-skill-pack-import

      - name: Persist blockers for inspection
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .repair
          cp /tmp/still-missing.tsv .repair/materialize-blockers.tsv 2>/dev/null || true
          cp /tmp/verification-errors.tsv .repair/materialize-verification-errors.tsv 2>/dev/null || true
          printf 'status=blocked\nmissing=%s\n' "$(wc -l < .repair/materialize-blockers.tsv 2>/dev/null || echo 0)" > .repair/materialize-status.txt
          rm -f .github/workflows/repair-materialize-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '418982818+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record exact repair materialization blockers' || exit 0
          git pull --rebase origin agent/repair-skill-pack-import || true
          git push origin HEAD:agent/repair-skill-pack-import || true
